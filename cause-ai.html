<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Cause AI</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #ffffff; color: #171717; height: 100vh; overflow: hidden; } .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 250px; background: #f7f7f8; border-right: 1px solid #e5e5e5; padding: 15px; } .logo { font-size: 21px; font-weight: bold; padding: 12px; margin-bottom: 12px; } .new-chat { width: 100%; padding: 12px; background: white; border: 1px solid #ddd; border-radius: 10px; cursor: pointer; text-align: left; font-size: 14px; } .new-chat:hover { background: #eeeeee; } .main { margin-left: 250px; height: 100vh; display: flex; flex-direction: column; } .topbar { height: 60px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #eee; font-weight: bold; } .chat { flex: 1; overflow-y: auto; padding: 30px 20px 140px; } .welcome { height: 70%; display: flex; flex-direction: column; justify-content: center; align-items: center; } .welcome h1 { font-size: 34px; margin-bottom: 8px; } .welcome p { color: #777; } .message { max-width: 760px; margin: 0 auto 25px; display: flex; gap: 14px; line-height: 1.6; } .avatar { min-width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; } .user-avatar { background: #171717; color: white; } .ai-avatar { background: #e7e7e7; color: #111; } .content { padding-top: 5px; white-space: pre-wrap; } .input-area { position: fixed; bottom: 0; left: 250px; right: 0; padding: 20px; background: linear-gradient(transparent, white 35%); } .input-box { max-width: 760px; margin: auto; display: flex; align-items: center; border: 1px solid #ccc; border-radius: 18px; padding: 5px 7px 5px 16px; background: white; box-shadow: 0 2px 12px rgba(0,0,0,.06); } #prompt { flex: 1; border: none; outline: none; padding: 12px 0; font-size: 15px; } #send { width: 40px; height: 40px; border: none; border-radius: 11px; background: #171717; color: white; cursor: pointer; font-size: 18px; } #send:disabled { opacity: .4; } @media (max-width: 700px) { .sidebar { display: none; } .main { margin-left: 0; } .input-area { left: 0; } .welcome h1 { font-size: 28px; } } </style> </head> <body> <aside class="sidebar"> <div class="logo">Cause AI</div> <button class="new-chat" onclick="newChat()"> + New chat </button> </aside> <main class="main"> <div class="topbar"> Cause AI </div> <div id="chat" class="chat"> <div id="welcome" class="welcome"> <h1>How can I help you?</h1> <p>Ask Cause AI anything.</p> </div> </div> <div class="input-area"> <div class="input-box"> <input id="prompt" type="text" placeholder="Message Cause AI..." autocomplete="off" > <button id="send" onclick="sendMessage()">↑</button> </div> </div> </main> <script src="script.js"></script> </body> </html>
